<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar de Mercado</title>
    
    <!-- Carga de Tailwind CSS sin build step -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tipografías utilitarias -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Configuración exacta de la paleta del terminal financiero -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        base: '#0B0E14',
                        surface: '#121722',
                        accent: '#E0A458',
                        pos: '#6FCF97',
                        neg: '#D9694F',
                        blueAlert: '#3b82f6', // Celeste/Azul para lider_soporte
                        blueBg: '#1e3a8a'
                    },
                    fontFamily: {
                        sans: ['Space Grotesk', 'sans-serif'],
                        mono: ['IBM Plex Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Estilos de scrollbar y utilidades visuales */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0B0E14; }
        ::-webkit-scrollbar-thumb { background: #121722; border: 1px solid #E0A458; }
        ::-webkit-scrollbar-corner { background: #0B0E14; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1a2233; border: none; border-radius: 2px;}

        .dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
        .dot-pos { background-color: #6FCF97; box-shadow: 0 0 5px rgba(111, 207, 151, 0.4); }
        .dot-neg { background-color: #D9694F; box-shadow: 0 0 5px rgba(217, 105, 79, 0.4); }
        .dot-null { background-color: #374151; } /* Gris para valores null */
        
        .bar-bg { background-color: #1a2233; }
        
        /* Tooltip custom para el Universo Técnico */
        .ticker-row { position: relative; cursor: crosshair; }
    </style>
</head>
<body class="bg-base text-gray-300 font-sans p-4 md:p-8 min-h-screen relative">
    
    <!-- Banner de errores de fetch -->
    <div id="error-message" class="hidden bg-neg/20 text-neg border border-neg p-4 mb-6 font-mono text-sm rounded-sm"></div>

    <!-- Banner de corrida degradada (falló una porción grande del universo -- RS Score no confiable) -->
    <div id="degraded-banner" class="hidden bg-neg/20 text-neg border border-neg p-4 mb-6 font-mono text-sm rounded-sm"></div>

    <!-- 1. Encabezado -->
    <header class="mb-8 border-b border-surface pb-4 flex flex-col xl:flex-row justify-between xl:items-end gap-6">
        <div>
            <h1 class="text-3xl font-bold text-white tracking-tight uppercase">Radar de Mercado</h1>
            <div id="last-update" class="font-mono text-sm text-gray-500 mt-1 leading-relaxed">Sincronizando datos...</div>
            <!-- Badges de estado -->
            <div id="badges" class="flex flex-wrap gap-2 font-mono text-xs uppercase mt-3"></div>
        </div>

        <div class="flex flex-col sm:flex-row items-start sm:items-center gap-4">
            <!-- 2. Buscador de Ticker -->
            <div class="flex items-center bg-surface border border-surface focus-within:border-accent transition-colors rounded-sm overflow-hidden p-1 shadow-inner">
                <input type="text" id="ticker-search" class="bg-transparent text-white w-24 sm:w-32 px-3 py-1.5 focus:outline-none uppercase font-mono text-sm placeholder-gray-600" placeholder="TICKER">
                <button id="ticker-search-btn" class="bg-base hover:bg-accent hover:text-base text-gray-400 px-3 py-1.5 transition-colors font-mono text-xs font-bold rounded-sm border border-gray-800">BUSCAR</button>
            </div>

            <!-- Botón de escaneo manual -->
            <a href="https://github.com/victoriagramigna/radar-mercado/actions/workflows/radar.yml"
               target="_blank" rel="noopener"
               class="flex items-center gap-2 bg-accent text-base hover:bg-white transition-colors px-4 py-2 rounded-sm font-mono text-xs font-bold uppercase whitespace-nowrap">
                🔄 Correr escaneo ahora
            </a>

            <!-- 6. Calculadora CCL Manual -->
            <div class="bg-surface border border-surface p-3 rounded-sm flex flex-col sm:flex-row items-start sm:items-center gap-4 font-mono text-xs">
                <div class="flex items-center gap-2">
                    <span class="text-gray-400">CCL RADAR:</span>
                    <span id="ccl-auto" class="text-white font-bold text-sm">—</span>
                </div>
                <div class="hidden sm:block text-gray-600">|</div>
                <div class="flex items-center gap-2">
                    <span class="text-gray-400">TU BRÓKER:</span>
                    <div class="flex items-center bg-base border border-gray-700 rounded-sm focus-within:border-accent transition-colors overflow-hidden">
                        <span class="px-2 text-gray-500">$</span>
                        <input type="number" id="ccl-manual" class="bg-transparent text-white w-20 py-1.5 focus:outline-none" placeholder="1590">
                    </div>
                    <span id="ccl-diff" class="font-bold text-gray-500 w-16 text-right">—</span>
                </div>
            </div>
        </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
        <div class="lg:col-span-2 space-y-6">
            
            <!-- 3. Sección Alertas (Con Scroll y Contador) -->
            <section>
                <div class="flex justify-between items-end border-b border-surface pb-1 mb-4">
                    <h2 id="alert-title" class="text-accent uppercase text-sm font-bold tracking-widest">Alertas Activas (0)</h2>
                </div>
                <!-- 4. Contenedor de Alertas -->
                <div id="alerts-container" class="grid grid-cols-1 gap-4 max-h-[360px] overflow-y-auto pr-2 custom-scrollbar"></div>
            </section>

            <!-- 5. Detalle por Sector (Ranking) -->
            <section>
                <h2 class="text-accent uppercase text-sm font-bold tracking-widest mb-4 border-b border-surface pb-1">Universo Técnico</h2>
                <div id="sectors-detail" class="space-y-6"></div>
            </section>
        </div>

        <div class="space-y-6">
            <!-- Sección Nueva: Top 10 -->
            <section>
                <h2 class="text-accent uppercase text-sm font-bold tracking-widest mb-4 border-b border-surface pb-1">Top 10 Fuerza Relativa</h2>
                <div id="top10-container" class="bg-surface p-4 space-y-3 rounded-sm border border-surface"></div>
            </section>

            <!-- 4. Rotación Sectorial -->
            <section>
                <h2 class="text-accent uppercase text-sm font-bold tracking-widest mb-4 border-b border-surface pb-1">Rotación Sectorial (RS)</h2>
                <div id="sector-rotation" class="bg-surface p-5 space-y-5 rounded-sm border border-surface"></div>
            </section>

            <!-- Panel CEDEAR caro/barato -->
            <section>
                <h2 class="text-accent uppercase text-sm font-bold tracking-widest mb-4 border-b border-surface pb-1">CEDEAR caro/barato</h2>
                <div id="cedears-panel" class="bg-surface p-4 space-y-1 rounded-sm border border-surface max-h-[400px] overflow-y-auto custom-scrollbar"></div>
            </section>
        </div>
    </div>

    <!-- Modal de Detalle de Ticker Flotante -->
    <div id="ticker-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-base/90 p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-surface border border-gray-700 rounded-sm shadow-2xl w-full max-w-lg relative">
            <button id="close-modal" class="absolute top-3 right-4 text-gray-500 hover:text-white font-mono font-bold text-lg">✕</button>
            <div id="modal-content" class="p-6">
                <!-- Contenido dinámico del Ticker se inyecta acá -->
            </div>
        </div>
    </div>

    <script>
        const DATA_URL = 'https://raw.githubusercontent.com/victoriagramigna/radar-mercado/main/data/ultimo.json';
        
        let currentAutoCcl = null;
        let currentRadarData = null; // Guardamos el estado global para búsquedas

        async function fetchRadarData() {
            try {
                const response = await fetch(`${DATA_URL}?t=${Date.now()}`, { cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                currentRadarData = data; // Almacenamos el último JSON en memoria
                document.getElementById('error-message').classList.add('hidden');
                renderDashboard(data);
            } catch (error) {
                const errorEl = document.getElementById('error-message');
                errorEl.textContent = `[ FALLO DE CONEXIÓN ] No se pudieron obtener los datos de GitHub: ${error.message}`;
                errorEl.classList.remove('hidden');
            }
        }

        // Lógica del Input CCL
        document.getElementById('ccl-manual').addEventListener('input', (e) => {
            const diffSpan = document.getElementById('ccl-diff');
            const manualVal = parseFloat(e.target.value);
            
            if (!currentAutoCcl || isNaN(manualVal) || manualVal <= 0) {
                diffSpan.textContent = '—';
                diffSpan.className = 'font-bold text-gray-500 w-16 text-right';
                return;
            }
            
            const diffPct = ((manualVal - currentAutoCcl) / currentAutoCcl) * 100;
            const isPos = diffPct > 0;
            diffSpan.textContent = `${isPos ? '+' : ''}${diffPct.toFixed(2)}%`;
            diffSpan.className = `font-bold w-16 text-right ${isPos ? 'text-pos' : 'text-neg'}`;
        });

        // Lógica del Buscador
        function performSearch() {
            if (!currentRadarData) return;
            const query = document.getElementById('ticker-search').value.trim().toUpperCase();
            if (!query) return;

            const modal = document.getElementById('ticker-modal');
            const content = document.getElementById('modal-content');
            
            const rankingArray = currentRadarData?.ranking ?? [];
            const tickerData = rankingArray.find(t => t?.Ticker?.toUpperCase() === query);

            if (!tickerData) {
                content.innerHTML = `
                    <div class="text-neg font-mono text-center py-10 border border-dashed border-neg/30 rounded-sm bg-base mt-4">
                        [ <span class="font-bold">${query}</span> NO ESTÁ EN EL UNIVERSO DEL RADAR ]
                    </div>
                `;
                modal.classList.remove('hidden');
                return;
            }

            // Buscar si tiene alerta activa
            const alertas = currentRadarData?.alertas ?? [];
            const alerta = alertas.find(a => a?.Ticker?.toUpperCase() === query);
            let alertHtml = '';

            if (alerta) {
                const recomendacion = alerta?.['Recomendación final'] ?? '—';
                const estado = alerta?.Estado ?? '—';
                const tipo = alerta?.Tipo ?? 'tecnico';
                
                let recColor = 'text-accent border-accent'; 
                let bgCustom = 'bg-surface border-l-2 border-surface';
                let titleIcon = '';

                if (tipo === 'lider_soporte') {
                    recColor = 'bg-blueAlert/20 text-blueAlert border border-blueAlert';
                    bgCustom = 'bg-[#151b2b] border-l-4 border-blueAlert shadow-[inset_0_0_20px_rgba(59,130,246,0.05)]';
                    titleIcon = '🎯 ';
                } else {
                    if (recomendacion === 'COMPRA') recColor = 'bg-pos text-base border-pos';
                    if (recomendacion === 'VENTA') recColor = 'bg-neg text-base border-neg';
                    if (recomendacion === 'MANTENER') recColor = 'bg-accent text-base border-accent';
                }

                alertHtml = `
                    <div class="${bgCustom} p-4 rounded-sm mb-6 mt-2 border border-gray-800">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-sm font-bold text-white uppercase">${titleIcon}ALERTA TÉCNICA ACTIVA</span>
                            <span class="font-mono text-xs px-2 py-1 font-bold rounded-sm ${recColor}">${recomendacion}</span>
                        </div>
                        <div class="font-mono text-sm text-gray-300">${estado}</div>
                    </div>
                `;
            }

            // Procesar métricas para la tarjeta
            const rsScore = tickerData?.RS_Score ?? 0;
            const rsColor = rsScore > 80 ? 'bg-pos' : (rsScore > 40 ? 'bg-accent' : 'bg-neg');
            const distMax = tickerData?.['Dist_Max52w_%'];
            const distMaxColor = (distMax != null && distMax > -3) ? 'text-pos font-bold' : 'text-gray-400';
            const distMaxText = distMax != null ? `${distMax > 0 ? '+' : ''}${distMax.toFixed(2)}% del máx 52w` : '—';
            
            const s50Text = tickerData?.SMA50 != null ? `$${tickerData.SMA50.toFixed(2)}` : 'sin datos';
            const dist50 = tickerData?.['Dist_SMA50_%'];
            const dist50Text = dist50 != null ? `(${dist50 > 0 ? '+' : ''}${dist50.toFixed(1)}%)` : '';
            const dist50Color = dist50 > 0 ? 'text-pos' : 'text-neg';

            const s200Text = tickerData?.SMA200 != null ? `$${tickerData.SMA200.toFixed(2)}` : 'sin datos aún';
            const dist200 = tickerData?.['Dist_SMA200_%'];
            const dist200Text = dist200 != null ? `(${dist200 > 0 ? '+' : ''}${dist200.toFixed(1)}%)` : '';
            const dist200Color = dist200 > 0 ? 'text-pos' : 'text-neg';

            content.innerHTML = `
                ${alertHtml}
                <div class="${alerta ? '' : 'mt-2'} flex justify-between items-end mb-6">
                    <div>
                        <h2 class="text-4xl font-bold text-white uppercase tracking-tight">${tickerData.Ticker}</h2>
                        <span class="text-sm font-mono text-accent uppercase tracking-widest">${tickerData.Sector ?? '—'}</span>
                    </div>
                    <div class="text-right">
                        <div class="text-3xl font-mono text-white">$${tickerData.Precio?.toFixed(2) ?? '—'}</div>
                        <div class="text-xs font-mono mt-1 ${distMaxColor}">${distMaxText}</div>
                    </div>
                </div>
                
                <div class="mb-6 bg-base p-4 rounded-sm border border-gray-800">
                    <div class="flex justify-between font-mono text-xs mb-2 uppercase">
                        <span class="text-gray-400 tracking-widest">RS Score</span>
                        <span class="text-white font-bold">${rsScore.toFixed(0)} / 100</span>
                    </div>
                    <div class="h-2 w-full bar-bg rounded-full overflow-hidden">
                        <div class="h-full ${rsColor}" style="width: ${Math.min(rsScore, 100)}%"></div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 font-mono text-sm">
                    <div class="bg-base p-3 rounded-sm border border-gray-800">
                        <div class="text-gray-500 text-[10px] uppercase mb-1 tracking-widest">SMA 50</div>
                        <div class="text-white">${s50Text}</div>
                        <div class="text-[11px] ${dist50Color}">${dist50Text}</div>
                    </div>
                    <div class="bg-base p-3 rounded-sm border border-gray-800">
                        <div class="text-gray-500 text-[10px] uppercase mb-1 tracking-widest">SMA 200</div>
                        <div class="text-white">${s200Text}</div>
                        <div class="text-[11px] ${dist200Color}">${dist200Text}</div>
                    </div>
                    <div class="bg-base p-3 rounded-sm border border-gray-800">
                        <div class="text-gray-500 text-[10px] uppercase mb-1 tracking-widest">RSI (14)</div>
                        <div class="text-white">${tickerData.RSI?.toFixed(1) ?? '—'}</div>
                    </div>
                    <div class="bg-base p-3 rounded-sm border border-gray-800">
                        <div class="text-gray-500 text-[10px] uppercase mb-1 tracking-widest">Volumen Relativo</div>
                        <div class="text-white">${tickerData.Vol_rel?.toFixed(2) ?? '—'}x</div>
                    </div>
                </div>
            `;
            
            modal.classList.remove('hidden');
        }

        document.getElementById('ticker-search-btn').addEventListener('click', performSearch);
        document.getElementById('ticker-search').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });
        
        // Cerrar Modal con el botón X
        document.getElementById('close-modal').addEventListener('click', () => {
            document.getElementById('ticker-modal').classList.add('hidden');
        });

        // Cerrar Modal al clickear afuera de la tarjeta
        document.getElementById('ticker-modal').addEventListener('click', (e) => {
            if (e.target.id === 'ticker-modal') {
                e.target.classList.add('hidden');
            }
        });

        function renderCedearPanel(data) {
            const container = document.getElementById('cedears-panel');
            const info = data?.cedears_pricing;
            if (!info || info.sin_datos) {
                container.innerHTML = '<div class="text-gray-500 font-mono text-xs p-2">Sin datos hoy (falló data912.com).</div>';
                return;
            }
            const items = (info.cedears ?? []).filter(c => !c.sin_datos);
            if (items.length === 0) {
                container.innerHTML = '<div class="text-gray-500 font-mono text-xs p-2">Sin datos disponibles.</div>';
                return;
            }
            items.sort((a, b) => Math.abs(b['Brecha_%']) - Math.abs(a['Brecha_%']));

            container.innerHTML = items.map(c => {
                const brecha = c['Brecha_%'];
                const esCaro = brecha > 0;
                const color = esCaro ? 'text-neg border-neg' : 'text-pos border-pos';
                return `
                    <div class="flex justify-between items-center py-2 border-b border-gray-800 last:border-0">
                        <div>
                            <div class="font-mono text-sm font-bold text-white">${c.Ticker}</div>
                            <div class="font-mono text-[10px] text-gray-500">real $${c.Precio_real_ARS.toLocaleString('es-AR')} · teórico $${c.Precio_teorico_ARS.toLocaleString('es-AR')}</div>
                        </div>
                        <span class="border ${color} px-2 py-1 rounded-sm font-mono text-xs font-bold whitespace-nowrap">
                            ${esCaro ? 'CARO' : 'BARATO'} ${brecha > 0 ? '+' : ''}${brecha}%
                        </span>
                    </div>`;
            }).join('');
        }

        function renderDashboard(data) {
            // Timestamp y 24hs format
            const fechaGenerado = data?.generado_utc;
            const formatOpts = { hour12: false, hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit', year: 'numeric' };
            const dateStr = fechaGenerado ? new Date(fechaGenerado).toLocaleString('es-AR', formatOpts) : 'Fecha desconocida';
            
            // Próxima corrida
            const proxima = data?.proxima_corrida_estimada_utc;
            let proximaStr = '';
            if (proxima) {
                const pxDate = new Date(proxima);
                const diaMes = pxDate.toLocaleDateString('es-AR', {day: '2-digit', month: '2-digit'});
                const hora = pxDate.toLocaleTimeString('es-AR', {hour12: false, hour: '2-digit', minute: '2-digit'});
                proximaStr = `<br><span class="text-xs text-gray-500 border-b border-dashed border-gray-600 cursor-help" title="GitHub Actions corre los crons de forma automática pero no garantiza el horario exacto -- puede demorarse en momentos de alta demanda.">Próxima corrida estimada: ${diaMes} ${hora} (hora ARG)</span>`;
            }

            document.getElementById('last-update').innerHTML = `T-0: <span class="text-white">${dateStr}</span>${proximaStr}`;

            // CCL Update
            currentAutoCcl = data?.cedears_pricing?.ccl ?? null;
            document.getElementById('ccl-auto').textContent = currentAutoCcl ? `$${currentAutoCcl.toFixed(2)}` : '—';
            document.getElementById('ccl-manual').dispatchEvent(new Event('input'));
            renderCedearPanel(data);

            // Banner de corrida degradada (mucho de la fuente de datos falló)
            const degradedEl = document.getElementById('degraded-banner');
            if (data?.corrida_degradada) {
                const nFallidos = (data?.tickers_fallidos ?? []).length;
                degradedEl.innerHTML = `⚠️ CORRIDA CON DATOS PARCIALES — falló el ${data.pct_fallidos}% del universo (${nFallidos} ticker(s)). El RS Score de esta corrida no es confiable (percentil sobre una muestra chica). No se enviaron notificaciones de Telegram esta corrida.`;
                degradedEl.classList.remove('hidden');
            } else {
                degradedEl.classList.add('hidden');
            }

            // Renderizado de Badges (Sumando la Brecha Cambiaria)
            const badgesHtml = [];
            if (data?.frescura_dato?.sospechoso) {
                badgesHtml.push(`<span class="bg-accent text-base px-2 py-1 font-bold rounded-sm animate-pulse">⚠️ DATO VIEJO / SOSPECHOSO</span>`);
            }

            // Badge chico de fuentes con problemas (solo si NO es una corrida degradada -- ese caso ya tiene el banner grande arriba)
            const nFallidos = (data?.tickers_fallidos ?? []).length;
            if (nFallidos > 0 && !data?.corrida_degradada) {
                const listaTickers = data.tickers_fallidos.map(f => f.ticker).join(', ');
                badgesHtml.push(`<span class="border border-accent text-accent px-2 py-1 rounded-sm bg-surface cursor-help" title="Falló: ${listaTickers}">⚠️ ${nFallidos} FUENTE(S) CON PROBLEMAS</span>`);
            }
            
            const vixSano = data?.regimen_mercado?.sano ?? true;
            const vixColor = vixSano ? 'border-pos text-pos' : 'border-neg text-neg';
            const vixValue = data?.regimen_mercado?.vix ?? '—';
            badgesHtml.push(`<span class="border ${vixColor} px-2 py-1 rounded-sm bg-surface">VIX: ${vixValue}</span>`);

            const macroStable = data?.contexto_macro?.estable ?? true;
            const macroColor = macroStable ? 'border-pos text-pos' : 'border-neg text-neg';
            const riesgoPais = data?.contexto_macro?.riesgo_pais ?? '—';
            badgesHtml.push(`<span class="border ${macroColor} px-2 py-1 rounded-sm bg-surface">RIESGO PAÍS: ${riesgoPais}</span>`);
            
            // Badge Brecha Cambiaria recuperado
            const brecha = data?.contexto_macro?.['brecha_cambiaria_%'] ?? '—';
            badgesHtml.push(`<span class="border ${macroColor} px-2 py-1 rounded-sm bg-surface">BRECHA: ${brecha}%</span>`);

            document.getElementById('badges').innerHTML = badgesHtml.join('');

            // Renderizado de Alertas
            const alertsContainer = document.getElementById('alerts-container');
            const alertas = data?.alertas ?? [];
            
            document.getElementById('alert-title').textContent = `Alertas Activas (${alertas.length})`;
            
            if (alertas.length === 0) {
                alertsContainer.innerHTML = '<div class="text-gray-500 font-mono text-sm p-4 border border-dashed border-surface rounded-sm">Sin señales técnicas en las últimas 48hs.</div>';
            } else {
                alertas.sort((a, b) => {
                    const getRank = (alerta) => {
                        const rec = alerta?.['Recomendación final'];
                        if (rec === 'COMPRA' || alerta?.Tipo === 'lider_soporte') return 1;
                        if (rec === 'VENTA') return 2;
                        return 3;
                    };
                    return getRank(a) - getRank(b);
                });

                alertsContainer.innerHTML = alertas.map(alerta => {
                    const recomendacion = alerta?.['Recomendación final'] ?? '—';
                    const ticker = alerta?.Ticker ?? '—';
                    const sector = alerta?.Sector ?? '—';
                    const estado = alerta?.Estado ?? '—';
                    const score = alerta?.Score ?? '—';
                    const ajustado = alerta?.['Ajustado por'] ?? '—';
                    const tipo = alerta?.Tipo ?? 'tecnico';

                    let recColor = 'text-accent border-accent'; 
                    let containerBorder = 'border-l-2 border-surface hover:border-l-accent';
                    let bgCustom = 'bg-surface';
                    let titleIcon = '';

                    if (tipo === 'lider_soporte') {
                        recColor = 'bg-blueAlert/20 text-blueAlert border border-blueAlert';
                        containerBorder = 'border-l-4 border-blueAlert shadow-[inset_0_0_20px_rgba(59,130,246,0.05)]';
                        bgCustom = 'bg-[#151b2b]'; 
                        titleIcon = '🎯 ';
                    } else {
                        if (recomendacion === 'COMPRA') recColor = 'bg-pos text-base border-pos';
                        if (recomendacion === 'VENTA') recColor = 'bg-neg text-base border-neg';
                        if (recomendacion === 'MANTENER') recColor = 'bg-accent text-base border-accent';
                    }

                    return `
                        <div class="${bgCustom} p-4 ${containerBorder} transition-colors rounded-r-sm">
                            <div class="flex justify-between items-start mb-3">
                                <div>
                                    <span class="text-xl font-bold text-white">${titleIcon}${ticker}</span>
                                    <span class="text-xs font-mono text-gray-500 ml-2 uppercase">${sector}</span>
                                </div>
                                <span class="font-mono text-xs px-2 py-1 font-bold rounded-sm ${recColor}">${recomendacion}</span>
                            </div>
                            <div class="font-mono text-sm text-gray-300 mb-3">${estado}</div>
                            <div class="flex justify-between font-mono text-xs text-gray-500 border-t border-base pt-2 mt-auto">
                                <span>SCORE: <span class="text-white">${score}</span></span>
                                <span>ADJ: ${ajustado}</span>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            const rankingArray = data?.ranking ?? [];

            // Renderizado Top 10
            const top10Container = document.getElementById('top10-container');
            if (rankingArray.length === 0) {
                top10Container.innerHTML = '<div class="text-gray-500 font-mono text-xs">Sin datos.</div>';
            } else {
                const top10 = [...rankingArray].sort((a, b) => (b?.RS_Score ?? 0) - (a?.RS_Score ?? 0)).slice(0, 10);
                top10Container.innerHTML = top10.map((ticker, index) => {
                    const rsScore = ticker?.RS_Score ?? 0;
                    const dotClass = ticker?.Sobre_SMA50 ? 'dot-pos' : 'dot-neg';
                    return `
                        <div class="flex justify-between items-center border-b border-base/50 pb-2 mb-2 last:border-0 last:pb-0 last:mb-0">
                            <div class="flex items-center gap-2">
                                <span class="text-gray-600 font-mono text-xs w-4">${index + 1}.</span>
                                <span class="font-bold text-white w-14">${ticker?.Ticker ?? '—'}</span>
                                <span class="text-[10px] uppercase text-gray-500 truncate w-24 hidden 2xl:inline-block">${ticker?.Sector ?? '—'}</span>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="font-mono text-accent text-sm w-8 text-right">${rsScore.toFixed(0)}</span>
                                <span class="dot ${dotClass}"></span>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // Renderizado de Rotación Sectorial
            const sectorRot = document.getElementById('sector-rotation');
            const rsPorSector = data?.rs_por_sector ?? {};
            const sortedSectors = Object.entries(rsPorSector).sort((a, b) => (b[1] ?? 0) - (a[1] ?? 0));
            
            if (sortedSectors.length === 0) {
                sectorRot.innerHTML = '<div class="text-gray-500 font-mono text-sm">Sin datos de rotación.</div>';
            } else {
                const maxRs = Math.max(...sortedSectors.map(s => s[1] ?? 0));
                sectorRot.innerHTML = sortedSectors.map(([sector, rs]) => {
                    const currentRs = rs ?? 0;
                    const width = maxRs > 0 ? (currentRs / maxRs) * 100 : 0;
                    const displayRs = typeof currentRs === 'number' ? currentRs.toFixed(1) : '—';
                    
                    return `
                        <div>
                            <div class="flex justify-between font-mono text-xs mb-1 uppercase">
                                <span class="text-gray-300">${sector}</span>
                                <span class="text-accent">${displayRs}</span>
                            </div>
                            <div class="h-1.5 w-full bar-bg rounded-full overflow-hidden">
                                <div class="h-full bg-accent" style="width: ${width}%"></div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // Renderizado de Detalle por Sector
            const sectorsDetail = document.getElementById('sectors-detail');
            if (rankingArray.length === 0) {
                sectorsDetail.innerHTML = '<div class="text-gray-500 font-mono text-sm p-4 border border-dashed border-surface rounded-sm">Universo técnico vacío.</div>';
            } else {
                const groupedBySector = rankingArray.reduce((acc, item) => {
                    const s = item?.Sector ?? 'Otros';
                    if (!acc[s]) acc[s] = [];
                    acc[s].push(item);
                    return acc;
                }, {});

                sectorsDetail.innerHTML = Object.keys(groupedBySector).sort().map(sector => {
                    const rows = groupedBySector[sector].sort((a, b) => (b?.RS_Score ?? 0) - (a?.RS_Score ?? 0)).map(ticker => {
                        const rsScore = ticker?.RS_Score ?? 0;
                        const precio = ticker?.Precio ?? 0;
                        const tickerName = ticker?.Ticker ?? '—';
                        
                        // Lógica Puntos Medias Móviles
                        const dot50Class = ticker?.Sobre_SMA50 ? 'dot-pos' : 'dot-neg';
                        const dist200 = ticker?.['Dist_SMA200_%'];
                        let dot200Class = 'dot-null'; 
                        if (dist200 != null) {
                            dot200Class = dist200 > 0 ? 'dot-pos' : 'dot-neg';
                        }
                        
                        // Lógica Distancia Máximos 52w
                        const distMax = ticker?.['Dist_Max52w_%'];
                        const distMaxText = distMax != null ? `(${distMax > 0 ? '+' : ''}${distMax.toFixed(1)}% del máx.)` : '';
                        const distMaxColor = (distMax != null && distMax > -3) ? 'text-pos font-bold' : 'text-gray-500';

                        const rsColor = rsScore > 80 ? 'bg-pos' : (rsScore > 40 ? 'bg-accent' : 'bg-neg');
                        const displayPrecio = typeof precio === 'number' ? precio.toFixed(2) : '—';
                        const displayRs = typeof rsScore === 'number' ? rsScore.toFixed(0) : '—';
                        
                        // Lógica Tooltip Hover
                        const s50V = ticker?.SMA50 != null ? `$${ticker.SMA50.toFixed(2)} (${ticker['Dist_SMA50_%'] > 0 ? '+' : ''}${ticker['Dist_SMA50_%'].toFixed(1)}%)` : 'sin datos';
                        const s200V = ticker?.SMA200 != null ? `$${ticker.SMA200.toFixed(2)} (${ticker['Dist_SMA200_%'] > 0 ? '+' : ''}${ticker['Dist_SMA200_%'].toFixed(1)}%)` : 'sin datos aún';
                        const rsiV = ticker?.RSI != null ? ticker.RSI.toFixed(1) : '—';
                        const volV = ticker?.Vol_rel != null ? ticker.Vol_rel.toFixed(2) + 'x' : '—';
                        
                        const tooltipText = `SMA50: ${s50V} · SMA200: ${s200V} · RSI: ${rsiV} · Vol: ${volV}`;

                        return `
                            <div class="ticker-row flex flex-wrap md:flex-nowrap items-center py-2 border-b border-base/50 font-mono text-sm hover:bg-base/40 px-2 -mx-2 transition-colors" title="${tooltipText}">
                                <div class="w-16 font-bold text-white">${tickerName}</div>
                                
                                <div class="w-28 flex-shrink-0 text-right mr-4 md:mr-6">
                                    <div class="text-gray-400">${displayPrecio}</div>
                                    <div class="text-[10px] ${distMaxColor} tracking-tight">${distMaxText}</div>
                                </div>
                                
                                <div class="flex-grow flex items-center gap-3 w-full md:w-auto mt-2 md:mt-0 order-last md:order-none">
                                    <div class="w-full bar-bg h-1.5 max-w-[200px] rounded-full overflow-hidden">
                                        <div class="h-full ${rsColor}" style="width: ${Math.min(rsScore, 100)}%"></div>
                                    </div>
                                    <div class="w-10 text-right text-xs text-gray-500">${displayRs}</div>
                                </div>
                                
                                <div class="w-32 text-right flex justify-end items-center gap-2 text-[10px] text-gray-400 ml-auto tracking-widest">
                                    <span>50</span><span class="dot ${dot50Class} mr-1"></span>
                                    <span>200</span><span class="dot ${dot200Class}"></span>
                                </div>
                            </div>
                        `;
                    }).join('');

                    const sectorScoreRaw = rsPorSector[sector];
                    const sectorScoreDisplay = typeof sectorScoreRaw === 'number' ? sectorScoreRaw.toFixed(1) : '—';

                    return `
                        <div class="bg-surface p-4 rounded-sm border border-surface">
                            <h3 class="font-bold text-white mb-3 flex items-center justify-between uppercase">
                                ${sector}
                                <span class="text-xs font-mono text-accent bg-base px-2 py-1 rounded-sm">RS ${sectorScoreDisplay}</span>
                            </h3>
                            ${rows}
                        </div>
                    `;
                }).join('');
            }
        }

        // Refresco automático
        fetchRadarData();
        setInterval(fetchRadarData, 5 * 60 * 1000); // 300.000 milisegundos
    </script>
</body>
</html>
