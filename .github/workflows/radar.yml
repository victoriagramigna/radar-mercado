name: Radar de Mercado

on:
  # Corrida completa diaria, después del cierre de NYSE (21:15 UTC ≈ 18:15 ARG)
  schedule:
    - cron: '15 21 * * 1-5'
    # Corridas livianas intradiarias, cada 1h en horario de mercado (14-21 UTC ≈ 11-18 ARG)
    - cron: '0 14-21 * * 1-5'

  # Permite correrlo a mano desde la pestaña "Actions" de GitHub -- IMPORTANTE:
  # usar esto para probar el pipeline completo antes de confiar en el cron.
  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo de ejecución'
        required: true
        default: 'test'
        type: choice
        options: [test, produccion]

jobs:
  correr-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr el radar
        env:
          # Por defecto "test" -- solo el disparo MANUAL puede pasar a "produccion".
          # Los crons automáticos SIEMPRE corren en modo test hasta que decidamos
          # activarlo a mano acá (ver punto de dry-run acordado en el diseño).
          RADAR_MODO: ${{ github.event.inputs.modo || 'test' }}
          # Secrets -- se cargan desde GitHub Settings > Secrets, nunca hardcodeados
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/main.py

      - name: Commitear el resultado actualizado
        run: |
          git config user.name "radar-bot"
          git config user.email "actions@github.com"
          git add data/ultimo.json data/historial_alertas.json
          git diff --staged --quiet || git commit -m "Actualización automática de datos [skip ci]"
          git push
